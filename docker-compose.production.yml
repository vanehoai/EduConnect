services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      - TZ=Asia/Ho_Chi_Minh
    env_file:
      - .env.production
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    ports:
      - '5435:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-educonnect_production}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_signal: SIGTERM
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '1024M'
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  redis:
    image: redis:7-alpine
    restart: always
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    stop_signal: SIGTERM
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: '512M'
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    user: 'node'
    environment:
      - TZ=Asia/Ho_Chi_Minh
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '4000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider http://localhost:3000/api/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    stop_signal: SIGTERM
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '1024M'
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    user: 'node'
    environment:
      - TZ=Asia/Ho_Chi_Minh
    env_file:
      - .env.production
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000']
      interval: 10s
      timeout: 5s
      retries: 5
    stop_signal: SIGTERM
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '1024M'
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  postgres_prod_data:
  redis_prod_data:
