name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: school
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: school_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://school:testpassword@localhost:5432/school_management_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test-access-secret-32-chars-long-min
      JWT_REFRESH_SECRET: test-refresh-secret-32-chars-long-min
      NEXT_PUBLIC_API_URL: http://localhost:4000/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
      - name: Prisma Migrate Deploy
        run: npm run db:deploy --workspace=@school/api
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run Tests
        run: npm run test
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Start services for E2E
        run: |
          npm run start --workspace=@school/api &
          npm run start --workspace=@school/web &
          npx wait-on http://localhost:4000/api/health http://localhost:3000

      - name: Playwright Smoke Tests
        run: npx playwright test tests/e2e/smoke.spec.ts --project=chromium
        working-directory: apps/web

      - name: Playwright A11y Tests
        run: npx playwright test tests/e2e/a11y.spec.ts --project=chromium
        working-directory: apps/web
        continue-on-error: true
